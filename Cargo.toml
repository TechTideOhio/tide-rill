[package]
name = "tide-rill"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
readme = "README.md"
repository = "https://github.com/TechTideOhio/tide-rill"
description = "TideOS Eval Kit (Tool 5): offline retrieval (recall@k, MRR, nDCG) and faithfulness scoring with a fail-closed per-metric gate."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "tide-rill"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
must_use_candidate = "allow"
